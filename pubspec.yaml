name: team_tracker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_maps_flutter: ^2.9.0
  supabase_flutter: ^2.5.0
  geolocator: ^14.1.2
  permission_handler: ^13.0.2
  image_picker: ^1.1.2
  share_plus: ^13.3.1
  path_provider: ^2.1.4
  widgets_to_image: ^2.0.1
  sqflite: ^2.3.0    
  path: ^1.8.3
  file_picker: ^13.3.3
  xml: ^7.1.0
  google_maps_flutter_android: ^2.21.0
  google_maps_flutter_platform_interface: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/fondo_auth.jpg
    - assets/images/foto1.jpg
    - assets/images/foto2.jpg
    - assets/images/foto3.jpg